[profile.default]
src = "contracts"
test = "tests/solidity"
out = "target/solidity/out"
cache_path = "target/solidity/cache"
libs = []
auto_detect_remappings = false
auto_detect_solc = false
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "spec/fixtures" }, { access = "read", path = "spec/upstream.json" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
