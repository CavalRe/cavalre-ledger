[package]
name = "cavalre-ledger-runtime-tests"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
cavalre-ledger-indexed = { path = "../../experiments/indexed-ledger" }
cavalre-ledger-solana = { path = "../../crates/cavalre-ledger-solana", features = ["no-entrypoint"] }
anchor-lang = "=1.2.0"
litesvm = "=0.16.0"
solana-account = "4.3.1"
solana-address = "2.6.1"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "=4.4.1"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode"] }
solana-instruction = "3.4.0"
solana-instruction-error = "2.4.0"
solana-transaction-error = "3.3.2"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
spl-token-interface = "3.0.0"
spl-token-2022-interface = "=2.1.0"
spl-token-metadata-interface = "=0.8.0"
token2022-current = { package = "spl-token-2022-interface", version = "=3.1.2" }
spl-transfer-hook-interface = "=2.1.0"
spl-tlv-account-resolution = "=0.11.4"
wincode = "=0.5.5"
serde_json = "1"
base64 = "=0.22.1"
solana-compute-budget-interface = "=3.0.0"

[[test]]
name = "ledger"
path = "ledger.rs"

[[test]]
name = "indexed"
path = "indexed.rs"
