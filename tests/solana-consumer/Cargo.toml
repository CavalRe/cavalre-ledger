[package]
name = "cavalre-ledger-consumer-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
anchor-lang = "=1.2.0"
cavalre-ledger-solana = { path = "../../crates/ledger-solana", features = ["no-entrypoint"] }
spl-token-2022-interface = "=3.1.2"
spl-transfer-hook-interface = "=2.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
