[package]
name = "cavalre-ledger-integration-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cavalre-ledger-solana = { path = "../../crates/ledger-solana", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "=0.11.4"
borsh = { version = "=1.8.1", features = ["derive"] }
spl-token-2022-interface = "=3.1.2"
spl-transfer-hook-interface = "=2.1.0"
anchor-lang = "=1.2.0"
litesvm = "=0.16.0"
solana-account = "4.3.1"
solana-address = "2.6.1"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3.3.1"
solana-instruction = "3.4.0"
solana-instruction-error = "2.4.0"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode"] }
solana-clock = "=3.1.1"
solana-compute-budget-interface = "3.0.0"
spl-token-interface = "3.0.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wincode = "0.5.5"

[[test]]
name = "solana"
path = "solana.rs"
