[workspace]
members = ["crates/cavalre-ledger-core", "crates/cavalre-ledger-solana", "tests/runtime", "tests/consumer", "experiments/indexed-ledger"]
default-members = ["crates/cavalre-ledger-core", "crates/cavalre-ledger-solana"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
publish = false
repository = "https://github.com/CavalRe/cavalre-ledger"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
