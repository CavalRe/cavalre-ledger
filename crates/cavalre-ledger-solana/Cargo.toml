[package]
name = "cavalre-ledger-solana"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Fresh Solana Ledger draft based on the original Solidity LedgerLib"

[dependencies]
cavalre-ledger-core = { path = "../cavalre-ledger-core", version = "0.1.0", default-features = false }
pinocchio = "=0.9.3"
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
solana-sha256-hasher = "=3.1.0"
solana-keccak-hasher = { version = "=3.1.0", features = ["sha3"] }
keccak-const = "=0.2.0"
spl-token-2022-interface = "=3.1.2"
spl-token-metadata-interface = "=1.0.0"
spl-transfer-hook-interface = { optional = true, version = "=2.1.0" }
anchor-spl = { optional = true, version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["mutations"]
mutations = ["cavalre-ledger-core/mutations", "dep:anchor-spl", "dep:spl-transfer-hook-interface"]
no-entrypoint = []
# The build script selects the direct transfer entrypoint and disables Anchor's raw entrypoint.
p-token-entrypoint = ["no-entrypoint"]
cpi = ["no-entrypoint", "mutations"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl?/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
