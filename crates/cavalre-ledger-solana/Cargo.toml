[package]
name = "cavalre-ledger-solana"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Fresh Solana Ledger draft based on the original Solidity LedgerLib"

[dependencies]
cavalre-ledger-core = { path = "../cavalre-ledger-core", version = "0.1.0", default-features = false }
anchor-lang = "=1.2.0"
anchor-spl = { optional = true, version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["mutations"]
mutations = ["cavalre-ledger-core/mutations", "dep:anchor-spl"]
no-entrypoint = []
cpi = ["no-entrypoint", "mutations"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl?/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
